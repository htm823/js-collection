<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reading List - JS Collection</title>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
	<header class="my-10">
		<div class="container-xl w-10/12 mx-auto">
			<h1 class="text-3xl font-bold">Reading List</h1>
		</div>
	</header>
	<main>
		<div class="container-xl w-10/12 mx-auto my-10">
			<form id="add-book">
				<label for="title" class="block mt-3">Title</label>
				<input id="title" name="title" class="border rounded-sm block" type="text">
				<label for="author" class="block mt-3">Author</label>
				<input id="author" name="author" class="border rounded-sm block" type="text">
				<button id="add-btn" class="block mt-5 cursor-pointer">Add New Book</button>
			</form>
			<form id="search-book">
				<label for="search-box" class="mt-5 block">Search</label>
				<input id="search-box" name="search" type="text" class="border rounded-sm block">
				<button id="search-btn" class="mt-5 block">Search</button>
			</form>
			<ul id="reading-list" class="my-7">
				<!-- Read books -->
			</ul>
		</div>
	</main>
	<footer>
		<div class="container-xl w-10/12 mx-auto my-10">
			<small>&copy; 2026 JS Collection. All rights reserved.</small>
		</div>
	</footer>
	<script>

		// 関数化は後でやる

		'use strict';

		const books = [
			{ title: 'Harry Potter', author: 'J. K. Rolling' },
			{ title: 'Feel Good Productivity', author: 'Ali Abdaal' },
			{ title: 'Deep Work', author: 'Cal Newport' }
		];

		const readingList = document.getElementById('reading-list');

		let readBooks = [];
		books.forEach(book => {
			const readBook = `
				<li>
					<ul>
						<li>${book.title}</li>
						<li>${book.author}</li>
					</ul>
				</li>
			`;

			readBooks.push(readBook);
		});

		readingList.insertAdjacentHTML('beforeend', readBooks.join(''));

		const form = document.getElementById('add-book');
		const title = document.getElementById('title');
		const author = document.getElementById('author');
		const searchBook = document.getElementById('search-book');
		const searchBox = document.getElementById('search-box');

		form.addEventListener('submit', (e) => {
			e.preventDefault();

			const titleValue = title.value.trim();
			const authorValue = author.value.trim();

			if (!titleValue) return;
			if (!authorValue) return;

			const newBook = {
				title: titleValue,
				author: authorValue,
			};

			books.push(newBook);

			readBooks = [];

			books.forEach(book => {
				const readBook = `
				<li>
					<ul>
						<li>${book.title}</li>
						<li>${book.author}</li>
					</ul>
				</li>
			`;

				readBooks.push(readBook);
			});

			readingList.innerHTML = '';

			readingList.insertAdjacentHTML('beforeend', readBooks.join(''));

			form.reset();
		});

		searchBook.addEventListener('submit', (e) => {
			e.preventDefault();

			const keyword = searchBox.value.trim();
			if (keyword === '') return;

			// Partial Match & case-insensitive
			const results = books.filter(book => {
				const regex = new RegExp(keyword, 'i');
				return regex.test(book.title) || regex.test(book.author);
			});

			readBooks = [];

			results.forEach(book => {
				const readBook = `
				<li>
					<ul>
						<li>${book.title}</li>
						<li>${book.author}</li>
					</ul>
				</li>
			`;

				readBooks.push(readBook);
			});

			readingList.innerHTML = '';

			readingList.insertAdjacentHTML('beforeend', readBooks.join(''));

			form.reset();
		});
	</script>
</body>

</html>
