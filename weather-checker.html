<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Weather Checker - JS Collection</title>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
	<header class="my-10">
		<div class="container-xl w-10/12 mx-auto">
			<h1 class="text-3xl font-bold">Weather Checker</h1>
		</div>
	</header>
	<main>
		<div id="weather-field" class="container-xl w-10/12 mx-auto my-10">
			<label for="weather" class="block mb-3">Select today's weather.</label>
			<select id="weather" class="inline border border-black rounded-xs p-1 mb-6 cursor-pointer">
				<option value=""></option>
				<option value="sunny">☀️</option>
				<option value="cloudy">☁️</option>
				<option value="rainy">☔️</option>
				<option value="stormy">⛈️</option>
				<option value="snowy">☃️</option>
			</select>
			<!-- Display some messages here -->
		</div>
	</main>
	<footer>
		<div class="container-xl w-10/12 mx-auto my-10">
			<small>&copy; 2026 JS Collection. All rights reserved.</small>
		</div>
	</footer>
	<script>
		'use strict';

		const selectEl = document.getElementById('weather');
		const weatherField = document.getElementById('weather-field');

		const msgs = {
			sunny: "It\'s sunny day. Don\'t forget your sunglasses!",
			cloudy: "It\'s cloudy day. The sky is full of clouds.",
			rainy: "It\'s raining now. Take an umbrella with you.",
			stormy: "There is a storm outside. Stay indoors and be careful.",
			snowy: "It\'s snowing today. Wear a warm coat and gloves.",
			default: "Select today's weather.",
		}


		selectEl.addEventListener('change', () => {
			const weather = selectEl.value ?? '';

			let msg = weather ? msgs[weather] : msgs.default;

			const resultEl = document.createElement('p');
			resultEl.textContent = msg;
			resultEl.classList.add('result');

			switch (weather) {
				case 'sunny':
					resultEl.classList.add('text-orange-800');
					break;
				case 'cloudy':
					resultEl.classList.add('text-sky-700');
					break;
				case 'rainy':
					resultEl.classList.add('text-teal-800');
					break;
				case 'stormy':
					resultEl.classList.add('text-olive-600');
					break;
				case 'snowy':
					resultEl.classList.add('text-mauve-500');
					break;
			}

			const existingResults = document.querySelectorAll('.result');
			existingResults.forEach(result => result.remove());

			weatherField.appendChild(resultEl);
		});
	</script>
</body>

</html>
