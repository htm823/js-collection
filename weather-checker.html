<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BMI Calculator - JS Collection</title>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
	<header class="my-10">
		<div class="container-xl w-10/12 mx-auto">
			<h1 class="text-3xl font-bold">Weather Checker</h1>
		</div>
	</header>
	<main>
		<div id="weather-field" class="container-xl w-10/12 mx-auto my-10">
			<div class="mt-10">
				<label for="weather" class="block">Today's Weather</label>
				<div class="flex py-3 gap-2">
					<select id="weather" class="inline border border-black rounded-xs p-1">
						<option value="">Please select the weather.</option>
						<option value="sunny">☀️</option>
						<option value="cloudy">☁️</option>
						<option value="rainy">☔️</option>
						<option value="stormy">⛈️</option>
						<option value="snowy">☃️</option>
					</select>
					<button id="check-btn" type="button" class="bg-cyan-700 rounded-xs text-white py-1 px-3">Check</button>
				</div>

			</div>

		</div>
	</main>
	<footer>
		<div class="container-xl w-10/12 mx-auto my-10">
			<small>&copy; 2026 JS Collection. All rights reserved.</small>
		</div>
	</footer>
	<script>
		'use strict';

		const weatherSelect = document.getElementById('weather');
		const checkBtn      = document.getElementById('check-btn');
		const weatherField  = document.getElementById('weather-field');

		const msgs = {
			sunny: "It\'s sunny day. Don\'t forget your sunglasses!",
			cloudy: "It\'s cloudy day. The sky is full of clouds.",
			rainy: "It\'s raining now. Take an umbrella with you.",
			stormy: "There is a storm outside. Stay indoors and be careful.",
			snowy: "It\'s snowing today. Wear a warm coat and gloves.",
			default: "Weather not found. Please try again.",
		}

		checkBtn.addEventListener('click', () => {
			const weather = weatherSelect.value;

			let msg = msgs[weather] ?? msgs.default;

			const resultElement       = document.createElement('p');
			resultElement.textContent = msg;
			resultElement.classList.add('mt-10', 'result');

			const existingResults = document.querySelectorAll('.result');
			existingResults.forEach(result => result.remove());

			weatherField.append(resultElement);
		});
	</script>
</body>

</html>
