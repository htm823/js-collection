<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Naruto Character Explorer - JS Collection</title>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
	<header class="my-10">
		<div class="container-xl w-10/12 mx-auto">
			<h1 class="text-3xl font-bold">Naruto Character Explorer (Fan Project)</h1>
		</div>
	</header>
	<main>
		<div class="container-xl w-10/12 mx-auto">
			<div class="inline-block my-5">
				<label for="affiliation" class="block mb-2">Affiliation</label>
				<select id="affiliation" class="inline-block border border-black rounded-xs">
					<option value="">All affiliations</option>
					<option value="konoha">Konohagakure (Hidden Leaf Village)</option>
					<option value="suna">Sunagakure (Hidden Sand Village)</option>
					<option value="akatsuki">Akatsuki</option>
				</select>
			</div>
			<div class="inline-block my-5 ml-10">
				<label for="kekkei-genkai" class="block mb-2">Kekkei Genkai</label>
				<select id="kekkei-genkai" class="inline-block border border-black rounded-xs w-40">
					<option value="">All</option>
					<option value="yes">Yes</option>
					<option value="no">No</option>
				</select>
			</div>
			<ul id="cards" class="py-5 flex flex-wrap gap-6">
				<!-- Display results -->
			</ul>
		</div>
	</main>
	<footer>
		<div class="container-xl w-10/12 mx-auto my-10">
			<small>&copy; 2026 JS Collection. All rights reserved.</small>
		</div>
	</footer>
	<script>
		'use strict';

		const characters = [
			// Konohagakure (Hidden Leaf Village)
			{
				name: 'Naruto Uzumaki',
				affiliation: 'Konohagakure (Hidden Leaf Village)',
				hasKekkeiGenkai: false,
			},
			{
				name: 'Sasuke Uchiha',
				affiliation: 'Konohagakure (Hidden Leaf Village)',
				hasKekkeiGenkai: true,
			},
			{
				name: 'Hinata Hyuga',
				affiliation: 'Konohagakure (Hidden Leaf Village)',
				hasKekkeiGenkai: true,
			},
			{
				name: 'Rock Lee',
				affiliation: 'Konohagakure (Hidden Leaf Village)',
				hasKekkeiGenkai: false,
			},
			{
				name: 'Neji Hyuga',
				affiliation: 'Konohagakure (Hidden Leaf Village)',
				hasKekkeiGenkai: true,
			},
			{
				name: 'Might Guy',
				affiliation: 'Konohagakure (Hidden Leaf Village)',
				hasKekkeiGenkai: false,
			},
			{
				name: 'Kakashi Hatake',
				affiliation: 'Konohagakure (Hidden Leaf Village)',
				hasKekkeiGenkai: false,
			},

			// Sunagakure (Hidden Sand Village)
			{
				name: 'Gaara',
				affiliation: 'Sunagakure (Hidden Sand Village)',
				hasKekkeiGenkai: false,
			},
			{
				name: 'Temari',
				affiliation: 'Sunagakure (Hidden Sand Village)',
				hasKekkeiGenkai: false,
			},
			{
				name: 'Kankuro',
				affiliation: 'Sunagakure (Hidden Sand Village)',
				hasKekkeiGenkai: false,
			},

			// Akatsuki
			{
				name: 'Itachi Uchiha',
				affiliation: 'Akatsuki',
				hasKekkeiGenkai: true,
			},
			{
				name: 'Hidan',
				affiliation: 'Akatsuki',
				hasKekkeiGenkai: false,
			},
			{
				name: 'Deidara',
				affiliation: 'Akatsuki',
				hasKekkeiGenkai: false,
			},
		];

		const affiliationSelect = document.getElementById('affiliation');
		const kekkeiGenkaiSelect = document.getElementById('kekkei-genkai');
		const cards = document.getElementById('cards');

		function displayCards(targetCharacters) {
			let displayedCharacters = [];

			targetCharacters.forEach((targetCharacter) => {
				const card = `
<li class="w-1/4">
	<ul class="profile">
		<li>${targetCharacter.name}</li>
		<li>${targetCharacter.affiliation}</li>
	</ul>
</li>`;

				displayedCharacters.push(card);
			});

			cards.innerHTML = displayedCharacters.join('');
		}

		// All characters
		displayCards(characters);

		// Filters
		const filterCharacters = () => {
			const affiliation = affiliationSelect.value;
			const kekkeiGenkai = kekkeiGenkaiSelect.value;

			const results = characters.filter((character) => {

				// Affiliation
				const matchesAffiliation =
					affiliation === ''
					|| (affiliation === 'konoha' && character.affiliation === 'Konohagakure (Hidden Leaf Village)')
					|| (affiliation === 'suna' && character.affiliation === 'Sunagakure (Hidden Sand Village)')
					|| (affiliation === 'akatsuki' && character.affiliation === 'Akatsuki');

				// Kekkei Genkai
				const matchesKekkeiGenkai =
					kekkeiGenkai === ''
					|| (kekkeiGenkai === 'yes') === character.hasKekkeiGenkai
					|| (kekkeiGenkai === 'no') !== character.hasKekkeiGenkai;

				return matchesAffiliation && matchesKekkeiGenkai;
			});

			displayCards(results);
		}

		affiliationSelect.addEventListener('change', filterCharacters);
		kekkeiGenkaiSelect.addEventListener('change', filterCharacters);
	</script>
</body>

</html>
